<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emca</title>
<script src="../coi-register.js"></script>
<link rel="stylesheet" href="../vendor/xterm.css">
<script src="../vendor/xterm.min.js"></script>
<script src="../vendor/xterm-addon-fit.min.js"></script>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- emca (docs/emca.txt PART FIVE). THE TOP SURFACE IS THE SYSTEM'S: its
     operand is the system, so it carries the managers and the workspace verbs
     and nothing else — no brand, no links, no demo. One thing rendered
     responsively: the managers visible, the rarer verbs behind an overflow
     that is itself always visible. The pane toggles sit right, because they
     are how the layout is driven by hand and they never round-trip. -->
<div id="emcaTop">
  <span class="tgroup" id="managers">
    <button data-open="proc /proc" title="/proc — the process manager IS a filesystem; there is no ps here">Processes</button>
    <button data-open="pkg /pkg"   title="/pkg — packages are subtrees; installing binds">Packages</button>
    <button data-open="usr /usr"   title="/usr — who a user is, as files">Users</button>
    <button data-open="type /type" title="/type — the registry BOTH halves read; adding a manager is adding a file here">Types</button>
  </span>
  <span class="tgroup" id="right">
    <button id="tOverflow" title="the workspace's rarer verbs">⋯</button>
    <button id="tLeft"   title="show/hide the left pane (⌘B)">▤</button>
    <button id="tBottom" title="show/hide the bottom pane (⌘J)">▁</button>
  </span>
</div>
<!-- rare things do not earn permanent space (emca.txt): the workspace verbs
     that are used once a session live one click away, not on the bar. -->
<div id="emcaOverflow" hidden>
  <button data-cmd="Putall" title="write every window with unsaved changes">Putall</button>
  <button data-cmd="Dump"   title="save the window set to $home/emca.dump">Dump</button>
  <button data-cmd="Load"   title="reopen the window set from $home/emca.dump">Load</button>
  <button data-cmd="Exit"   title="close the workspace — refuses while anything is unwritten">Exit</button>
  <hr>
  <button data-home="play"    title="the shipped examples; nothing persists">home: examples</button>
  <button data-home="browser" title="private storage that survives reload">home: browser storage</button>
  <button data-home="folder"  title="your real disk — a granted directory IS a bind">home: local folder…</button>
</div>

<div id="emcaBody">
  <aside id="emcaLeft"><div class="paneBody"></div></aside>
  <div class="divider vert" id="dLeft" title="drag to resize"></div>
  <main id="emcaMain">
    <div id="emcaTabs"></div>
    <div id="emcaStack"></div>
  </main>
</div>

<div class="divider horz" id="dBottom" title="drag to resize"></div>
<div id="emcaBottom"><div class="paneBody"></div></div>

<!-- the status line: the GLOBAL TAG on the left — acme's root tag, finding a
     home — and ambient read-only state on the right. Operand determines
     surface, and this surface's operand is nothing. -->
<!-- Two zones, and it must earn its place — a status bar is the easiest surface
     in any app to fill with noise (emca.txt). LEFT: the global tag, free,
     editable, executable text at workspace scope — acme's ROOT TAG finding a
     home. RIGHT: ambient state, read-only, and nothing else. -->
<div id="emcaStatus">
  <input id="globalTag" spellcheck="false" placeholder="⌘⇧T — commands run in the workspace">
  <span id="ambient">
    <button id="pinChip" hidden title="the pinned range — the next Execute consumes it. Click to drop."></button>
    <span id="running" title="running commands — click one to kill it"></span>
    <span id="dirty" hidden title="windows with unwritten changes"></span>
    <span id="linecol" title="line:column"></span>
  </span>
  <span id="status"></span>
</div>
<script type="module" src="shell.mjs"></script>
</body>
</html>
