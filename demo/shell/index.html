<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emca — IPNX v12</title>
<script src="../coi-register.js"></script>
<link rel="stylesheet" href="../vendor/xterm.css">
<script src="../vendor/xterm.min.js"></script>
<script src="../vendor/xterm-addon-fit.min.js"></script>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- emca: the IPNX user interface (docs/emca.txt). The top surface carries
     THE SYSTEM — its operand is the system, so the managers live here; the
     pane toggles sit right because they drive the responsive layout by hand.
     Everything below is panes, and a pane's content is windows. -->
<div id="emcaTop">
  <span id="brand">emca</span>
  <span class="tgroup" id="managers">
    <button data-open="proc /proc"        title="/proc — the process manager is a filesystem">Processes</button>
    <button data-open="pkg /pkg"          title="/pkg — packages are subtrees; installing binds">Packages</button>
    <button data-open="project /usr/kitty" title="/project — templates and workspaces">Projects</button>
    <button data-open="usr /usr"          title="/usr — who a user is, as files">Users</button>
    <button data-open="net /net"          title="/net — connections are files">Network</button>
    <button data-open="type /type"        title="/type — the registry both halves read">Types</button>
  </span>
  <span class="tgroup" id="overflow">
    <select id="mHome" title="where your files live">
      <option value="play">home: play</option>
      <option value="browser">home: browser storage</option>
      <option value="folder">home: local folder…</option>
    </select>
    <button id="mAcme"  title="the raster exhibit">acme9</button>
    <button id="mTour"  title="the guided tour">Tour</button>
    <a class="mlink" href="../browser/">Suite</a>
    <a class="mlink" href="https://github.com/ChristineTham/ipnx-v12">GitHub</a>
  </span>
  <span class="tgroup" id="paneToggles">
    <button id="tLeft"   title="show/hide the rail (⌘B)">▤</button>
    <button id="tBottom" title="show/hide the transcript (⌘J)">▁</button>
  </span>
</div>

<div id="emcaBody">
  <aside id="emcaLeft"><div class="paneHead">rail</div><div class="paneBody"></div></aside>
  <main id="emcaMain">
    <div id="emcaTabs"></div>
    <div id="emcaStack"></div>
  </main>
</div>

<div id="emcaBottom"><div class="paneHead">transcript</div><div class="paneBody"></div></div>

<!-- the status line: the GLOBAL TAG on the left (acme's root tag, finding a
     home), ambient read-only state on the right. Operand determines surface. -->
<div id="emcaStatus">
  <input id="globalTag" spellcheck="false" placeholder="⌘⇧T — commands run in the workspace">
  <span id="status">booting…</span>
</div>
<script type="module" src="shell.mjs"></script>
</body>
</html>
