# Every push builds the guest world, then runs the system's own tests
# against it.
#
# The order is load-bearing and is the same one `CLAUDE.md` gives: **the
# userspace first**, because the host's tests run the real binaries and
# `cargo` cannot build a wasm userspace.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # PINNED, and to the version measured on the development machine
  # (`wasi-sdk/VERSION`: 34.0, llvm 23.1.0). It is here for its wasm backend
  # alone — nothing links against wasi — so a move is a toolchain
  # measurement, never a convenience.
  WASI_SDK_RELEASE: "34.0"
  # Binaryen, for `wasm-opt --asyncify` over every image: how this machine
  # gives a program setjmp, longjmp and fork (RESEARCH §16.12).
  BINARYEN_RELEASE: "132"

jobs:
  ci:
    name: the system, and its tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bison, for rc's grammar
        run: sudo apt-get update -q && sudo apt-get install -y -q bison

      - name: cache wasi-sdk
        id: toolcache
        uses: actions/cache@v4
        with:
          path: ~/opt
          key: wasi-sdk-${{ env.WASI_SDK_RELEASE }}-binaryen-${{ env.BINARYEN_RELEASE }}
      - name: install wasi-sdk and binaryen
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt && cd ~/opt
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_RELEASE%%.*}/wasi-sdk-${WASI_SDK_RELEASE}-x86_64-linux.tar.gz" | tar xz
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_RELEASE}/binaryen-version_${BINARYEN_RELEASE}-x86_64-linux.tar.gz" | tar xz

      - uses: Swatinem/rust-cache@v2

      # `userspace/build/` (objects) and `userspace/root/` (the files a
      # booting system finds by name), both gitignored.
      - name: build the guest world
        run: |
          export WASI_SDK=$HOME/opt/wasi-sdk-${WASI_SDK_RELEASE}-x86_64-linux
          export BINARYEN=$HOME/opt/binaryen-version_${BINARYEN_RELEASE}
          bash userspace/mk.sh

      # The kernel alone: no wasm, no host, no machine.
      - name: the kernel
        run: cargo test -p ipnx-kernel

      # The host, which boots the world built above and types at it —
      # `it_boots_to_a_shell`, `cat_etc_motd`, the pipeline, the store
      # surviving a reboot.
      - name: the host, on the real userspace
        run: cargo test -p ipnx

      # `-D warnings` rather than grepping the output, which goes quiet
      # when the cache makes the build a no-op.
      - name: no warnings
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --all-targets

      # **Expected red**, and deliberately not hidden. The suite asserts
      # functional equivalence with the demo and fails until it is
      # conformant — an earlier version printed "0 of 12" and reported `ok`,
      # which is the false signal it exists to prevent. It turns green at
      # P8, not before; the count in the log is the distance.
      - name: "conformance (red until P8)"
        continue-on-error: true
        run: cargo test -p conformance -- --nocapture

      - name: measurements (for RESEARCH)
        run: |
          echo "guest binaries: $(du -sb userspace/root | cut -f1) bytes"
          ls -l userspace/root/wasm/bin
