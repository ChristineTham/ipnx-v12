<!doctype html>
<!-- The hosted kernel in a page: same kernel.mjs as the Node host. The
     console is one window; the direction of travel (per RESEARCH §7) is
     windows as elements each backed by a per-window namespace, the way
     Wanix/Apptron compose theirs, with xterm.js as /dev/cons later. -->
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../coi-register.js"></script>
<title>ipnx-v12 — hosted kernel</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #14151a; color: #d6d8de;
         font: 14px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
         display: flex; align-items: center; justify-content: center; }
  .win { width: min(920px, 94vw); height: min(640px, 90vh); display: flex;
         flex-direction: column; background: #1d1f26; border: 1px solid #33363f;
         border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
  .title { padding: 8px 14px; background: #262933; color: #9aa0ad;
           border-bottom: 1px solid #33363f; border-radius: 8px 8px 0 0;
           display: flex; justify-content: space-between; }
  .body { flex: 1; overflow-y: auto; padding: 12px 14px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid #33363f; }
  .row .prompt { color: #7f8694; }
  input { flex: 1; background: none; border: none; outline: none;
          color: inherit; font: inherit; }
  .err { color: #e0707a; }
  .gwin { position: fixed; background: #101116; border: 1px solid #3a3e49;
          border-radius: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.55);
          display: flex; flex-direction: column; overflow: hidden; }
  .gwin.focused { border-color: #5b8af0; }
  .gtitle { display: flex; justify-content: space-between; gap: 12px;
            padding: 4px 10px; background: #232631; color: #9aa0ad;
            font-size: 12px; cursor: grab; user-select: none; }
  .gwin canvas { display: block; }
  .gtext { margin: 0; max-height: 130px; overflow-y: auto; padding: 4px 8px;
           font: 12px/1.4 ui-monospace, monospace; color: #cfd3db;
           white-space: pre-wrap; word-break: break-word; border-top: 1px solid #2c2f3a; }
  .gtext:empty { display: none; }
  .echo { color: #8b93a3; }
  .okline { color: #7fd487; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><span>cons — ipnx-v12</span><span id="status">booting…</span></div>
  <div class="body"><pre id="out"></pre></div>
  <div class="row"><span class="prompt">&gt;</span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>
</div>
<script type="module" src="./main.mjs"></script>
</body>
</html>
