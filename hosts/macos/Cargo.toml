[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kernel = { path = "../../kernel" }
# default features drag C build-deps (zstd for the module cache, gdbjit) —
# needless weight, and they block musl cross-builds (M1's FROM scratch image)
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc"] }
