# `ipnx` — the embedding for a terminal. It starts the kernel and serves the
# machine; the kernel holds none of the machine itself.
[package]
name = "ipnx"
version = "0.1.0"
edition.workspace = true

[dependencies]
ipnx-kernel = { path = "../../kernel" }

# The machine and the terminal, which only a terminal host has: the browser's
# host (`hosts/web`) uses the boot steps and the file server, and neither of
# these.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The engine. It lives HERE and only here: the kernel's machine trait names no
# machine, so this dependency cannot reach it.
# `async` is `wasmtime-fiber`: a host-stack fiber, which is this machine's
# `setlabel`/`gotolabel` (`pc/l.s:1000`, `:992`). Nothing here is threaded —
# the executor is a poll loop and the run queue is the kernel's.
wasmtime = { version = "39", default-features = false, features = ["cranelift", "runtime", "std", "async", "threads"] }
wat = "1"
# `SIGINT`: the terminal turns `^C` into a signal to this process, and the
# host catches it to hand the system its interrupt key.
libc = "0.2"
