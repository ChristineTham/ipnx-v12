<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saranos</title>
<meta name="description" content="Saranos in a browser: the IPNX kernel in a worker, each process a worker of its own, and emca, the window manager.">
<script src="coi-register.js"></script>
<link rel="stylesheet" href="emca.css">
</head>
<body>
<script type="module">
  // The page: the system booted, and emca — the window manager, which is
  // the host's — drawing it (docs/emca.md, Boot and the session).
  import { boot } from './saranos.mjs';
  import { Emca } from './emca.mjs';
  import { Surface } from './surface.mjs';

  if (!crossOriginIsolated) {
    document.body.textContent = 'This page needs cross-origin isolation for its shared memory, and does not have it yet.';
  } else {
    const emca = new Emca();
    window.emca = emca;
    const kmesg = [];
    const dec = new TextDecoder();
    // the console: what the kernel and the boot write, kept as Plan 9's
    // kernel keeps its log, and on the browser's own console
    const out = (b) => {
      const s = dec.decode(b, { stream: true });
      kmesg.push(s);
      console.log(s.replace(/\n$/, ''));
    };
    const sys = boot({ site: new URL('./', location.href), out, emca, halt: () => (document.body.textContent = 'Halted.') });
    window.kmesg = kmesg;
    new Surface(document.body, emca, sys);
    sys.done.then(({ status, ok }) => {
      if (!ok) document.body.textContent = `The system stopped: ${status}`;
    });
  }
</script>
</body>
</html>
