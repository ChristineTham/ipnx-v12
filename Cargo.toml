# Saranos — the operating system: the embedding and the wasm side together.
# IPNX is the kernel and the userspace inside it; emca is the windowing and UI
# system, and arrives with its own crates when the plan reaches it.
[workspace]
resolver = "2"
members = ["kernel", "hosts/ipnx", "conformance"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.77"

# **The dependencies are built optimised even in a debug build.** wasmtime
# compiles every image with Cranelift, and an unoptimised Cranelift took
# 1 min 46 s to start ghostscript's 4M module where an optimised one takes
# seconds (RESEARCH §16.17) — so a test that runs a large program measured
# the compiler, not the system. The system's own crates stay debug.
[profile.dev.package."*"]
opt-level = 3
